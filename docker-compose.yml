version: "3.9"

services:
  discord-bot:
    build: .
    env_file: .env
    environment:
      - OLLAMA_PORT=11434
      - OLLAMA_MODEL=qwen2.5:7b
      - OLLAMA_HOST=host.docker.internal
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    networks:
      - bot_net
  


networks:
  bot_net:
    driver: bridge